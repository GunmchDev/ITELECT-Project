<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body{
            background-color: #b4dffd;
        }
        .sidebar{
            background-color: #96b6e9;
            color: black;
            width: 200px;
            min-height: 100vh;
            padding: 10px;
        }
        .sidebar h5{
            width: 160px;
            margin-bottom: 20px;
            text-align: center;
            background-color: white;
            padding: 16px;
            border-radius: 10px;
            align-items: center;
            display: block;
            cursor: pointer;
        }
        .sidebar a{
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px;
            font-size: 20px;
            
        }
        .sidebar a:hover{
            background-color: #5ca9e0;
            padding-left: 15px;
            color: black;
        }
        .sidebar img{
            width: 30px;
        }
        .dropdown-menu{
            background-color: #6e9fec; 
        }
        .dropdown-menu a{
            color: white;
            padding: 8px 16px;
            font-size: 15px;
        }
        .header{
            background-color: #7eb0fa;
            color: white;
            padding: 16px;
            text-align: center;

        }
        .footer{
            background-color: #f8f9fa;
            text-align: center;
            color: #6c757d;
            padding: 16px;
            font-size: 14px;
        }
        .main-content{
            flex: 1;
            padding: 32px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px  rgba(0,0,0,0.1);
        }
        .income-box h5{
            color: green;
        }
        .expense-box{
            color: red;
        }
        .income-amount{
            color: green;
            font-weight: bold;
        }
        .container{
            width: 40%;
        }
    </style>
</head>
<body class="d-flex">
    <div class="sidebar"> 
        <h5><img src="image/balance-scale.png" alt="">    BudgIT</h5>
        <hr>
        <a href="">Home</a>
        <a href="">Track</a>
        <div class="dropdown mt-3">
            <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="settingsDropdown ">
              Settings
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">Login / Register</a></li>
            </ul>
          </div>
    </div>

    <div class="main-content d-flex flex-column">
        <div class="header">
            <h1>Personal Budget Tracker</h1>
            <p>Track your Income and Expense</p>
        </div>

        <div class="container mt-4">
            <div class="summary text-center mb-4">
                <h3>Your Balance: ₱ <span class="balance">0.00</span></h3>
                <div class="row justify-content-center">
                    <div class="col-5 income-box">
                        <h5>Income: ₱ <span class="income">0.00</span></h5>
                    </div>
                    <div class="col-5 expense-box">
                        <h5>Expense: ₱ <span class="expense">0.00</span></h5>
                    </div>
                </div>
            </div> 
            <form id="expenseForm" class="mb-4">
                <div class="mb-2">
                    <label for="type" class="form-label">Transaction</label>
                    <select id="type" class="form-select">
                        <option value="">-- Choose Type --</option>
                        <option value="">Add Money</option>
                        <option value="">Spend Money</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" id="description" class="form-control" placeholder="Salary, Groceries, Expenses, etc.">
                </div>
                <div class="mb-2">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" id="date" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="text" id="amount" class="form-control" placeholder="0.00">
                </div>
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </form>
            <table class="table table-bordered table-striped table-hover">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="transactionTable">

                </tbody>
            </table>
        </div>
        <div class="footer">
            &copy: Personal Budget Tracker by Luke Nazaren San Jose
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script>
    const form = document.getElementById("expenseForm");
    const description = document.getElementById("description");
    const type = document.getElementById("type");
    const date = document.getElementById("date");
    const amount = document.getElementById("amount");
    const income = document.getElementById("income");
    const expense = document.getElementById("expense");
    const balance = document.getElementById("balnce");
    const transactionTable = document.getElementById("transactionTable");
</script>
</body>
</html>
